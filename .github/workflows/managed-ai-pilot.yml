name: Managed AI Pilot CI and Deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: managed-ai-pilot-production
  cancel-in-progress: false

env:
  REGISTRY: registry.cn-hangzhou.aliyuncs.com
  IMAGE_NAME: xiagan/bookkeeping-managed-ai-pilot

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  image:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      immutable_ref: ${{ steps.image.outputs.immutable_ref }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Select immutable image reference
        id: image
        shell: bash
        run: |
          short_sha=${GITHUB_SHA::7}
          echo "immutable_ref=${REGISTRY}/${IMAGE_NAME}:main-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "moving_ref=${REGISTRY}/${IMAGE_NAME}:main" >> "$GITHUB_OUTPUT"
      - name: Login to Aliyun Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ALIYUN_DOCKER_USERNAME }}
          password: ${{ secrets.ALIYUN_DOCKER_PASSWORD }}
      - name: Build and optionally push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/managed-ai-pilot/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.image.outputs.immutable_ref }}
            ${{ steps.image.outputs.moving_ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Configure deployment SSH key
        shell: bash
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ECS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$ECS_HOST" >> ~/.ssh/known_hosts
      - name: Roll out immutable image
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          PILOT_IMAGE: ${{ needs.image.outputs.immutable_ref }}
        run: |
          ssh deploy@"$ECS_HOST" sudo /usr/local/sbin/deploy-bookkeeping-managed-ai-pilot "$PILOT_IMAGE"
      - name: Deployment summary
        run: |
          echo '## Managed AI pilot deployed' >> "$GITHUB_STEP_SUMMARY"
          echo '${{ needs.image.outputs.immutable_ref }}' >> "$GITHUB_STEP_SUMMARY"
