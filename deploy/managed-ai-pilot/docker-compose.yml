services:
  managed-ai-pilot:
    image: ${PILOT_IMAGE:?PILOT_IMAGE must be an immutable ACR tag}
    container_name: bookkeeping-managed-ai-pilot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PILOT_HOST: 0.0.0.0
      PILOT_PORT: 18084
      PILOT_DATABASE_PATH: /app/data/pilot.sqlite
    ports:
      - '127.0.0.1:18084:18084'
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:18084/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: journald
      options:
        tag: bookkeeping-managed-ai-pilot
        labels: service,environment
